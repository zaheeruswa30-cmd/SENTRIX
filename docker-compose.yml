# Sentrix — local container stack
#   docker compose up -d            → Postgres + Mailpit + Sentrix API/web app on http://localhost:8000
#   docker compose up -d mailpit    → just the SMTP catcher (web UI http://localhost:8025)
# The project name, Postgres user/database and queue name keep their original "securewatch"
# identifiers on purpose so existing volumes and data survive the Sentrix rebrand.
name: securewatch-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: securewatch
      POSTGRES_PASSWORD: securewatch
      POSTGRES_DB: securewatch
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securewatch"]
      interval: 10s
      retries: 5

  # Local SMTP catcher for ownership-verification emails (EMAIL_PROVIDER=smtp, SMTP_HOST=mailpit)
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  api:
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    image: sentrix-api:2.0
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: Sentrix
      DATABASE_URL: postgresql+psycopg://securewatch:securewatch@postgres:5432/securewatch
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST_DOCKER:-mailpit}
      SMTP_PORT: ${SMTP_PORT_DOCKER:-1025}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    ports: ["8000:8000"]
    volumes: ["./reports:/app/reports", "./outbox:/app/outbox"]
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }

  # ── Endpoint-platform roadmap services (optional) ─────────────────────
  # Enable with:  docker compose --profile endpoint up -d
  redis:
    image: redis:7-alpine
    profiles: ["endpoint"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: ["endpoint"]
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]

  worker:
    build: { context: ., dockerfile: deploy/Dockerfile.worker }
    profiles: ["endpoint"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://securewatch:securewatch@postgres:5432/securewatch
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    volumes: ["./reports:/app/reports"]
    depends_on: [api, redis]

volumes:
  pgdata:
  qdrantdata:
