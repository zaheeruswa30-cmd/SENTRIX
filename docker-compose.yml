name: securewatch-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: securewatch
      POSTGRES_PASSWORD: securewatch
      POSTGRES_DB: securewatch
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securewatch"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]

  api:
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://securewatch:securewatch@postgres:5432/securewatch
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    volumes: ["./uploads:/app/uploads", "./reports:/app/reports"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }

  worker:
    build: { context: ., dockerfile: deploy/Dockerfile.worker }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://securewatch:securewatch@postgres:5432/securewatch
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    volumes: ["./uploads:/app/uploads", "./reports:/app/reports"]
    depends_on: [api, redis]

volumes:
  pgdata:
  qdrantdata:
