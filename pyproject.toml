[project]
name = "sentrix"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "PyJWT>=2.9",
    "cryptography>=43",
    "dnspython>=2.7",
    "dkimpy>=1.1.8",
    "idna>=3.10",
    "httpx>=0.27",
    "fpdf2>=2.8",
]

[tool.vercel]
entrypoint = "backend.app.main:app"